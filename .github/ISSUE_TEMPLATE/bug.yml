name: Bug report
description: Something does not work or looks wrong
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: And what you expected instead. A screenshot helps.
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Which game
      description: Date and teams, or the number in the window title (Basesmall · 824624 · …). Live or replay?
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
  - type: input
    id: version
    attributes:
      label: Basesmall version
      description: Settings, About
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: System
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Linux
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Which download
      options:
        - Installer
        - Portable zip
        - Built from source
