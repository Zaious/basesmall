# The site at basesmall.chroniclecore.com: site/ plus the two pictures from docs/media (one copy of each
# in the repository). Runs when the site or those pictures change, or by hand.
name: Site

# Manual only until GitHub Pages is switched on for the repository and v0.1.0 is published (the
# download links point at the latest release). Then: also on pushes that touch site/ or docs/media/.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp docs/media/demo.gif docs/media/sizes.png _site/media/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
